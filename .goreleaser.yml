# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
project_name: bifrost

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: bifrost
    main: .
    binary: bifrost
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/nelobster/bifrost/internal/config.Version={{.Version}}

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: msneloy
    name: BIFROST
  draft: false
  prerelease: auto
