<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <title>BIFROST — Live Stream</title>
    <style>
      :root {
        --accent: #e53935;
        --bg: #000;
        --surface: rgba(20, 20, 20, 0.92);
        --border: rgba(255, 255, 255, 0.08);
        --text: #fff;
        --text2: rgba(255, 255, 255, 0.6);
        --green: #4caf50;
        --yellow: #ffc107;
        --red: #e53935;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        height: 100vh;
        overflow: hidden;
      }
      #video-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }
      video {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }

      /* ─── HUD (top-left: status indicator only) ────────────────── */
      .hud {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 20;
        background: var(--surface);
        backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.5px;
        transition: opacity 0.3s;
      }
      .hud-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #555;
        transition: all 0.3s;
      }
      .hud-dot.live {
        background: var(--green);
        box-shadow: 0 0 10px var(--green);
      }
      .hud-dot.connecting {
        background: var(--yellow);
        animation: pulse 1s infinite;
      }
      .hud-dot.offline {
        background: var(--red);
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
      .hud-label {
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 11px;
      }

      /* ─── Controls (top-right) ─────────────────────────────────── */
      .controls {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 20;
        display: flex;
        gap: 6px;
        opacity: 0;
        transition: opacity 0.3s;
      }
      #video-container:hover .controls {
        opacity: 1;
      }
      .ctrl-btn {
        background: var(--surface);
        backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        color: var(--text);
        font-family: inherit;
        font-size: 12px;
        font-weight: 500;
        padding: 8px 14px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.15s;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .ctrl-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.15);
      }
      .ctrl-btn:active {
        transform: scale(0.97);
      }

      /* ─── Metrics (bottom-right) ───────────────────────────────── */
      .metrics {
        position: absolute;
        bottom: 16px;
        right: 16px;
        z-index: 20;
        background: var(--surface);
        backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 14px;
        display: flex;
        gap: 16px;
        font-size: 12px;
        font-weight: 500;
        opacity: 0;
        transition: opacity 0.3s;
      }
      #video-container:hover .metrics {
        opacity: 1;
      }
      .metric {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .metric-label {
        color: var(--text2);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .metric-value {
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }
      .metric-value.good {
        color: var(--green);
      }
      .metric-value.warn {
        color: var(--yellow);
      }
      .metric-value.bad {
        color: var(--red);
      }

      /* ─── BIFROST watermark (bottom-left) ──────────────────────── */
      .watermark {
        position: absolute;
        bottom: 16px;
        left: 16px;
        z-index: 20;
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 3px;
        color: var(--accent);
        text-shadow:
          0 0 8px var(--accent),
          0 0 20px rgba(229, 57, 53, 0.4);
        opacity: 0.7;
        transition: opacity 0.3s;
        pointer-events: none;
      }
      #video-container:hover .watermark {
        opacity: 1;
      }

      /* ─── Connecting overlay ───────────────────────────────────── */
      #connecting {
        position: absolute;
        inset: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        gap: 16px;
      }
      #connecting .logo {
        font-size: 36px;
        font-weight: 800;
        color: var(--accent);
        letter-spacing: 4px;
        text-shadow:
          0 0 12px var(--accent),
          0 0 30px rgba(229, 57, 53, 0.5);
      }
      #connecting .sub {
        color: var(--text2);
        font-size: 14px;
      }
      #connecting .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="video-container">
      <video
        id="video"
        autoplay
        playsinline
        muted
        style="display: none"
      ></video>

      <!-- HUD: status indicator only -->
      <div class="hud">
        <div class="hud-dot" id="dot"></div>
        <span class="hud-label" id="label">CONNECTING</span>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button class="ctrl-btn" id="btn-refresh" title="Refresh">
          ↻ Refresh
        </button>
        <button class="ctrl-btn" id="btn-fullscreen" title="Fullscreen">
          ⛶ Fullscreen
        </button>
      </div>

      <!-- Metrics -->
      <div class="metrics">
        <div class="metric">
          <span class="metric-label">FPS</span
          ><span class="metric-value" id="m-fps">--</span>
        </div>
        <div class="metric">
          <span class="metric-label">LAT</span
          ><span class="metric-value" id="m-lat">--</span>
        </div>
      </div>

      <!-- BIFROST watermark -->
      <div class="watermark">BIFROST</div>

      <!-- Connecting overlay -->
      <div id="connecting">
        <div class="logo">BIFROST</div>
        <div class="spinner"></div>
        <div class="sub" id="status-text">Connecting...</div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const video = $("video");
      const dot = $("dot");
      const label = $("label");
      const connecting = $("connecting");
      const statusText = $("status-text");
      const mFps = $("m-fps");
      const mLat = $("m-lat");

      let pc = null;
      let reconnectTimer = null;
      let reconnectDelay = 1000;
      const MAX_RECONNECT_DELAY = 10000;
      let streamActive = false;
      let lastRTT = null;
      let gotTrack = false;

      // ─── Telemetry ────────────────────────────────────────────────
      function getDeviceInfo() {
        const ua = navigator.userAgent;
        let os = "Unknown",
          browser = "Unknown",
          device = "desktop";
        if (/android/i.test(ua)) {
          os = "Android";
          device = "mobile";
        } else if (/linux/i.test(ua)) os = "Linux";
        else if (/mac/i.test(ua)) os = "macOS";
        if (/chrome/i.test(ua) && !/edg/i.test(ua)) browser = "Chrome";
        else if (/firefox/i.test(ua)) browser = "Firefox";
        return {
          os,
          browser,
          device,
          resolution: `${screen.width}x${screen.height}`,
        };
      }
      function sendPing() {
        const info = getDeviceInfo();
        const p = new URLSearchParams({
          latency: lastRTT || "",
          os: info.os,
          browser: info.browser,
          resolution: info.resolution,
          device: info.device,
        });
        fetch(`/ping?${p}`).catch(() => {});
      }
      setInterval(sendPing, 3000);

      // ─── Health check — detect when stream goes offline ────────────
      function checkHealth() {
        fetch("/health")
          .then((r) => r.json())
          .then((data) => {
            const wasActive = streamActive;
            streamActive = data.streaming;
            if (wasActive && !streamActive) {
              // Stream went offline — force reconnect
              console.log("Stream went offline, reconnecting...");
              setStatus("connecting");
              connecting.style.display = "flex";
              statusText.textContent = "Stream went offline. Reconnecting...";
              video.style.display = "none";
              gotTrack = false;
              doReconnect();
            } else if (!streamActive && !gotTrack) {
              // Stream not active yet
              setStatus("connecting");
              connecting.style.display = "flex";
              statusText.textContent = "Waiting for stream to start...";
            }
          })
          .catch(() => {});
      }
      setInterval(checkHealth, 2000);

      // ─── Metrics ─────────────────────────────────────────────────
      function updateMetrics() {
        if (!pc) return;
        pc.getStats()
          .then((report) => {
            report.forEach((s) => {
              if (s.type === "inbound-rtp" && s.kind === "video") {
                const fps = s.framesPerSecond || 0;
                mFps.textContent = fps;
                mFps.className =
                  "metric-value " +
                  (fps < 15 ? "bad" : fps < 25 ? "warn" : "good");
              }
              if (
                s.type === "candidate-pair" &&
                s.state === "succeeded" &&
                s.currentRoundTripTime
              ) {
                const rtt = Math.round(s.currentRoundTripTime * 1000);
                lastRTT = rtt;
                mLat.textContent = rtt + "ms";
                mLat.className =
                  "metric-value " +
                  (rtt > 200 ? "bad" : rtt > 100 ? "warn" : "good");
              }
            });
          })
          .catch(() => {});
      }
      setInterval(updateMetrics, 1000);

      // ─── Status ──────────────────────────────────────────────────
      function setStatus(state) {
        dot.className = "hud-dot " + state;
        if (state === "live") {
          label.textContent = "LIVE";
          label.style.color = "var(--green)";
        } else if (state === "connecting") {
          label.textContent = "CONNECTING";
          label.style.color = "var(--yellow)";
        } else {
          label.textContent = "OFFLINE";
          label.style.color = "var(--red)";
        }
      }

      // ─── WebRTC ──────────────────────────────────────────────────
      function destroyPC() {
        if (pc) {
          pc.ontrack = null;
          pc.oniceconnectionstatechange = null;
          pc.close();
          pc = null;
        }
      }

      function doReconnect() {
        if (reconnectTimer) clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(() => {
          connect();
        }, reconnectDelay);
        // Exponential backoff with cap
        reconnectDelay = Math.min(reconnectDelay * 1.5, MAX_RECONNECT_DELAY);
      }

      async function connect() {
        destroyPC();
        setStatus("connecting");

        try {
          pc = new RTCPeerConnection({ iceServers: [] });
          pc.addTransceiver("video", { direction: "recvonly" });
          pc.addTransceiver("audio", { direction: "recvonly" });

          pc.ontrack = (event) => {
            console.log("ontrack:", event.track.kind, event.track.id);
            if (!video.srcObject) video.srcObject = new MediaStream();
            video.srcObject.addTrack(event.track);
            video.style.display = "block";
            connecting.style.display = "none";
            setStatus("live");
            gotTrack = true;
            reconnectDelay = 1000;
            video
              .play()
              .then(() => {
                // Unmute after playback starts — browsers require user gesture
                video.muted = false;
              })
              .catch(() => {});
          };

          pc.oniceconnectionstatechange = () => {
            const state = pc.iceConnectionState;
            console.log("ICE:", state);
            if (state === "connected" || state === "completed") {
              setStatus("live");
              reconnectDelay = 1000;
            } else if (state === "failed") {
              console.log("ICE failed, scheduling reconnect...");
              setStatus("offline");
              gotTrack = false;
              doReconnect();
            } else if (state === "disconnected") {
              setStatus("connecting");
              statusText.textContent = "Connection lost. Reconnecting...";
              connecting.style.display = "flex";
              doReconnect();
            }
          };

          pc.onicecandidate = (event) => {
            if (event.candidate) {
              fetch("/ice", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  candidate: event.candidate.candidate,
                  sdpMLineIndex: event.candidate.sdpMLineIndex,
                  sdpMid: event.candidate.sdpMid,
                }),
              }).catch(() => {});
            }
          };

          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);

          const resp = await fetch("/webrtc/offer", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sdp: pc.localDescription.sdp }),
          });
          if (!resp.ok) throw new Error(`Server error ${resp.status}`);
          const data = await resp.json();
          if (data.error) throw new Error(data.error);

          await pc.setRemoteDescription(
            new RTCSessionDescription({ type: "answer", sdp: data.sdp }),
          );
          pollICE();
        } catch (err) {
          console.error("WebRTC error:", err);
          statusText.textContent = "Connection error. Retrying...";
          setStatus("offline");
          doReconnect();
        }
      }

      function pollICE() {
        const poll = () => {
          if (!pc || pc.iceConnectionState === "failed") return;
          fetch("/ice/poll")
            .then((r) => r.json())
            .then((data) => {
              if (data.candidates) {
                for (const c of data.candidates) {
                  if (c.candidate)
                    pc.addIceCandidate(new RTCIceCandidate(c)).catch(() => {});
                }
              }
              if (pc && pc.iceConnectionState !== "failed")
                setTimeout(poll, 200);
            })
            .catch(() => {});
        };
        poll();
      }

      // ─── Controls ────────────────────────────────────────────────
      $("btn-refresh").addEventListener("click", () => location.reload());
      $("btn-fullscreen").addEventListener("click", () => {
        const el = $("video-container");
        if (!document.fullscreenElement) el.requestFullscreen().catch(() => {});
        else document.exitFullscreen();
      });

      // ─── Init ────────────────────────────────────────────────────
      connect();
    </script>
  </body>
</html>
