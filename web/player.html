<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <title>BIFROST — Live Stream</title>
    <style>
      :root {
        --accent: #e53935;
        --bg: #000;
        --surface: rgba(20, 20, 20, 0.92);
        --border: rgba(255, 255, 255, 0.08);
        --text: #fff;
        --text2: rgba(255, 255, 255, 0.6);
        --green: #4caf50;
        --yellow: #ffc107;
        --red: #e53935;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        height: 100vh;
        overflow: hidden;
      }
      #video-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }
      video {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }

      .hud {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 20;
        background: var(--surface);
        backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.5px;
        transition: opacity 0.3s;
      }
      .hud-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #555;
        transition: all 0.3s;
      }
      .hud-dot.live {
        background: var(--green);
        box-shadow: 0 0 10px var(--green);
      }
      .hud-dot.connecting {
        background: var(--yellow);
        animation: pulse 1s infinite;
      }
      .hud-dot.offline {
        background: var(--red);
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.4;
        }
      }
      .hud-label {
        text-transform: uppercase;
        letter-spacing: 1px;
        font-size: 11px;
      }
      .hud-latency {
        margin-left: 4px;
        font-size: 11px;
        font-weight: 400;
        color: var(--text2);
        font-variant-numeric: tabular-nums;
      }

      .controls {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 20;
        display: flex;
        gap: 6px;
        opacity: 0;
        transition: opacity 0.3s;
      }
      #video-container:hover .controls {
        opacity: 1;
      }
      .ctrl-btn {
        background: var(--surface);
        backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        color: var(--text);
        font-family: inherit;
        font-size: 12px;
        font-weight: 500;
        padding: 8px 14px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.15s;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .ctrl-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.15);
      }
      .ctrl-btn:active {
        transform: scale(0.97);
      }
      .ctrl-btn svg {
        width: 14px;
        height: 14px;
        fill: currentColor;
      }

      .metrics {
        position: absolute;
        bottom: 16px;
        right: 16px;
        z-index: 20;
        background: var(--surface);
        backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 14px;
        display: flex;
        gap: 16px;
        font-size: 12px;
        font-weight: 500;
        opacity: 0;
        transition: opacity 0.3s;
      }
      #video-container:hover .metrics {
        opacity: 1;
      }
      .metric {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .metric-label {
        color: var(--text2);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .metric-value {
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }
      .metric-value.good {
        color: var(--green);
      }
      .metric-value.warn {
        color: var(--yellow);
      }
      .metric-value.bad {
        color: var(--red);
      }

      #connecting {
        position: absolute;
        inset: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        gap: 16px;
      }
      #connecting .logo {
        font-size: 36px;
        font-weight: 800;
        color: var(--accent);
        letter-spacing: 4px;
      }
      #connecting .sub {
        color: var(--text2);
        font-size: 14px;
      }
      #connecting .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .volume-wrap {
        position: absolute;
        bottom: 16px;
        left: 16px;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--surface);
        backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 6px 12px;
        opacity: 0;
        transition: opacity 0.3s;
      }
      #video-container:hover .volume-wrap {
        opacity: 1;
      }
      .volume-wrap svg {
        width: 16px;
        height: 16px;
        fill: var(--text2);
        cursor: pointer;
      }
      .volume-slider {
        -webkit-appearance: none;
        appearance: none;
        width: 80px;
        height: 4px;
        background: var(--border);
        border-radius: 2px;
        outline: none;
      }
      .volume-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 12px;
        height: 12px;
        background: var(--text);
        border-radius: 50%;
        cursor: pointer;
      }

      #unmute {
        position: absolute;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 25;
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text);
        font-size: 14px;
        padding: 12px 24px;
        border-radius: 10px;
        cursor: pointer;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="video-container">
      <video
        id="video"
        autoplay
        playsinline
        muted
        style="display: none"
      ></video>
      <div class="hud">
        <div class="hud-dot" id="dot"></div>
        <span class="hud-label" id="label">CONNECTING</span>
        <span class="hud-latency" id="latency"></span>
      </div>
      <div class="controls">
        <button class="ctrl-btn" id="btn-reconnect" title="Reconnect">
          ↻ Reconnect
        </button>
        <button class="ctrl-btn" id="btn-fullscreen" title="Fullscreen">
          ⛶ Fullscreen
        </button>
      </div>
      <div class="metrics">
        <div class="metric">
          <span class="metric-label">FPS</span
          ><span class="metric-value" id="m-fps">--</span>
        </div>
        <div class="metric">
          <span class="metric-label">LAT</span
          ><span class="metric-value" id="m-lat">--</span>
        </div>
      </div>
      <div class="volume-wrap">
        <svg id="vol-icon" viewBox="0 0 24 24" onclick="toggleMute()">
          <path
            d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"
          />
        </svg>
        <input
          type="range"
          class="volume-slider"
          id="vol-slider"
          min="0"
          max="1"
          step="0.05"
          value="1"
          oninput="setVolume(this.value)"
        />
      </div>
      <button id="unmute" onclick="unmute()">Click to unmute</button>
      <div id="connecting">
        <div class="logo">BIFROST</div>
        <div class="spinner"></div>
        <div class="sub" id="status-text">Connecting via WebRTC...</div>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const video = $("video");
      const dot = $("dot");
      const label = $("label");
      const latencyEl = $("latency");
      const connecting = $("connecting");
      const statusText = $("status-text");
      const mFps = $("m-fps");
      const mLat = $("m-lat");

      let pc = null;
      let retryCount = 0;
      let lastRTT = null;

      // ─── Telemetry ────────────────────────────────────────────────
      function getDeviceInfo() {
        const ua = navigator.userAgent;
        let os = "Unknown",
          browser = "Unknown",
          device = "desktop";
        if (/android/i.test(ua)) {
          os = "Android";
          device = "mobile";
        } else if (/linux/i.test(ua)) os = "Linux";
        else if (/mac/i.test(ua)) os = "macOS";
        if (/chrome/i.test(ua) && !/edg/i.test(ua)) browser = "Chrome";
        else if (/firefox/i.test(ua)) browser = "Firefox";
        return {
          os,
          browser,
          device,
          resolution: `${screen.width}x${screen.height}`,
        };
      }
      function sendPing() {
        const info = getDeviceInfo();
        const p = new URLSearchParams({
          latency: lastRTT || "",
          os: info.os,
          browser: info.browser,
          resolution: info.resolution,
          device: info.device,
        });
        fetch(`/ping?${p}`).catch(() => {});
      }
      setInterval(sendPing, 3000);

      // ─── Volume ──────────────────────────────────────────────────
      function setVolume(v) {
        video.volume = v;
      }
      function toggleMute() {
        video.muted = !video.muted;
        $("vol-icon").style.opacity = video.muted ? "0.4" : "1";
        $("unmute").style.display = video.muted ? "block" : "none";
      }
      function unmute() {
        video.muted = false;
        $("vol-icon").style.opacity = "1";
        $("unmute").style.display = "none";
      }
      // Browser autoplay policy: start muted, prompt to unmute on interaction
      document.addEventListener(
        "click",
        () => {
          if (video.muted) $("unmute").style.display = "block";
        },
        { once: true },
      );

      // ─── Metrics ─────────────────────────────────────────────────
      function updateMetrics() {
        if (!pc) return;
        pc.getStats()
          .then((report) => {
            report.forEach((s) => {
              if (s.type === "inbound-rtp" && s.kind === "video") {
                const fps = s.framesPerSecond || 0;
                mFps.textContent = fps;
                mFps.className =
                  "metric-value " +
                  (fps < 15 ? "bad" : fps < 25 ? "warn" : "good");
              }
              if (
                s.type === "candidate-pair" &&
                s.state === "succeeded" &&
                s.currentRoundTripTime
              ) {
                const rtt = Math.round(s.currentRoundTripTime * 1000);
                lastRTT = rtt;
                mLat.textContent = rtt + "ms";
                mLat.className =
                  "metric-value " +
                  (rtt > 200 ? "bad" : rtt > 100 ? "warn" : "good");
                latencyEl.textContent = rtt + "ms";
              }
            });
          })
          .catch(() => {});
      }
      setInterval(updateMetrics, 1000);

      // ─── Status ──────────────────────────────────────────────────
      function setStatus(state) {
        dot.className = "hud-dot " + state;
        if (state === "live") {
          label.textContent = "LIVE";
          label.style.color = "var(--green)";
        } else if (state === "connecting") {
          label.textContent = "CONNECTING";
          label.style.color = "var(--yellow)";
        } else {
          label.textContent = "OFFLINE";
          label.style.color = "var(--red)";
        }
      }

      // ─── WebRTC ──────────────────────────────────────────────────
      function destroyPC() {
        if (pc) {
          pc.ontrack = null;
          pc.oniceconnectionstatechange = null;
          pc.close();
          pc = null;
        }
      }

      async function connect() {
        destroyPC();
        setStatus("connecting");
        connecting.style.display = "flex";
        statusText.textContent = "Connecting via WebRTC...";

        try {
          pc = new RTCPeerConnection({ iceServers: [] });
          pc.addTransceiver("video", { direction: "recvonly" });
          pc.addTransceiver("audio", { direction: "recvonly" });

          pc.ontrack = (event) => {
            console.log("ontrack:", event.track.kind, event.track.id);
            if (!video.srcObject) video.srcObject = new MediaStream();
            video.srcObject.addTrack(event.track);
            video.style.display = "block";
            connecting.style.display = "none";
            setStatus("live");
            retryCount = 0;
            // Explicitly start playback — browsers may block autoplay
            video.play().catch((e) => console.warn("video.play() failed:", e));
            // Auto-unmute on first track
            setTimeout(() => {
              video.muted = false;
              $("vol-icon").style.opacity = "1";
              $("unmute").style.display = "none";
            }, 500);
          };

          pc.oniceconnectionstatechange = () => {
            const state = pc.iceConnectionState;
            console.log("ICE:", state);
            if (state === "connected" || state === "completed") {
              setStatus("live");
              retryCount = 0;
            } else if (state === "failed") {
              setStatus("offline");
              retryCount++;
              if (retryCount < 5) setTimeout(connect, 2000);
              else
                statusText.textContent = "Connection failed. Refresh to retry.";
            }
          };

          pc.onicecandidate = (event) => {
            if (event.candidate) {
              fetch("/ice", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  candidate: event.candidate.candidate,
                  sdpMLineIndex: event.candidate.sdpMLineIndex,
                  sdpMid: event.candidate.sdpMid,
                }),
              }).catch(() => {});
            }
          };

          // Create offer and send to server
          const offer = await pc.createOffer();
          await pc.setLocalDescription(offer);

          const resp = await fetch("/webrtc/offer", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sdp: pc.localDescription.sdp }),
          });
          if (!resp.ok) throw new Error(`Server error ${resp.status}`);
          const data = await resp.json();
          if (data.error) throw new Error(data.error);

          await pc.setRemoteDescription(
            new RTCSessionDescription({ type: "answer", sdp: data.sdp }),
          );

          // Poll for any late ICE candidates
          pollICE();
        } catch (err) {
          console.error("WebRTC error:", err);
          statusText.textContent = "Connection error: " + err.message;
          retryCount++;
          if (retryCount < 5) setTimeout(connect, 3000);
        }
      }

      function pollICE() {
        const poll = () => {
          if (!pc || pc.iceConnectionState === "failed") return;
          fetch("/ice/poll")
            .then((r) => r.json())
            .then((data) => {
              if (data.candidates) {
                for (const c of data.candidates) {
                  if (c.candidate)
                    pc.addIceCandidate(new RTCIceCandidate(c)).catch(() => {});
                }
              }
              if (pc && pc.iceConnectionState !== "failed")
                setTimeout(poll, 200);
            })
            .catch(() => {});
        };
        poll();
      }

      // ─── Controls ────────────────────────────────────────────────
      $("btn-reconnect").addEventListener("click", () => {
        retryCount = 0;
        connect();
      });
      $("btn-fullscreen").addEventListener("click", () => {
        const el = $("video-container");
        if (!document.fullscreenElement) el.requestFullscreen().catch(() => {});
        else document.exitFullscreen();
      });

      // ─── Init ────────────────────────────────────────────────────
      connect();
    </script>
  </body>
</html>
