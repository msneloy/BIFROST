# Air configuration for BIFROST hot-reload
# Usage: make dev (headless mode, auto-restarts on code changes)
# For TUI mode, use: make tui

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/bifrost ."
  entrypoint = "./tmp/bifrost"
  full_bin = "./tmp/bifrost --headless"
  delay = 500
  include_ext = ["go", "html"]
  exclude_dir = ["tmp", "bin", "dist", "vendor", ".git", "web"]
  exclude_regex = ["_test.go$"]
  kill_delay = "2s"
  send_interrupt = true
  stop_on_error = true

[log]
  time = false

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[misc]
  clean_on_exit = true
